version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    ignore:
      # mcp 2.x removed mcp.server.fastmcp; stay on 1.x until the server is migrated.
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
